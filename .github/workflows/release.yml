name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hardhus-srv-ping-fix-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "v$V" "build/libs/hardhus-srv-ping-fix-$V.jar" \
            --target "$GITHUB_SHA" \
            --title "v$V" \
            --notes "Hardhus's SRV Ping Fix $V for Minecraft 1.21.1 / NeoForge. Client-side only."
